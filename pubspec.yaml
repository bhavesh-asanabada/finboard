version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  mongo_dart: ^0.10.3
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_slidable: ^3.1.1
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
